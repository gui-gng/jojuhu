# Jojuhu Root Docker Compose
# This file orchestrates all infrastructure and application services
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d backend      # Start only backend and its dependencies
#   docker-compose logs -f            # View all logs
#   docker-compose down               # Stop all services
#   docker-compose down -v            # Stop and remove all data
#
# Services:
#   - PostgreSQL (port 5432)
#   - Redis (port 6379)
#   - MinIO (port 9000, console 9001)
#   - OpenTelemetry Collector (port 4317, 4318)
#   - Jaeger (port 16686)
#   - Prometheus (port 9090)
#   - Grafana (port 3000)
#   - Backend API (port 8080)
#
# Environment variables can be set in .env file or overridden per command:
#   POSTGRES_PASSWORD=mypass docker-compose up -d

version: '3.8'

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    extends:
      file: infrastructure/docker-compose.yml
      service: postgres

  redis:
    extends:
      file: infrastructure/docker-compose.yml
      service: redis

  minio:
    extends:
      file: infrastructure/docker-compose.yml
      service: minio

  minio-createbucket:
    extends:
      file: infrastructure/docker-compose.yml
      service: minio-createbucket

  otel-collector:
    extends:
      file: infrastructure/docker-compose.yml
      service: otel-collector

  jaeger:
    extends:
      file: infrastructure/docker-compose.yml
      service: jaeger

  prometheus:
    extends:
      file: infrastructure/docker-compose.yml
      service: prometheus

  grafana:
    extends:
      file: infrastructure/docker-compose.yml
      service: grafana

  # ============================================
  # Application Services
  # ============================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jojuhu_backend_app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jojuhu}:${POSTGRES_PASSWORD:-jojuhu_secret}@postgres:5432/${POSTGRES_DB:-jojuhu_backend}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: jojuhu-uploads
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: jojuhu-backend
      OTEL_SERVICE_VERSION: 0.1.0
      HOST: 0.0.0.0
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      RUST_LOG: ${RUST_LOG:-info}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - jojuhu_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  jojuhu_network:
    driver: bridge
    name: jojuhu_network
