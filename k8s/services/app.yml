apiVersion: apps/v1
kind: Deployment
metadata:
  name: jojuhu-app
  namespace: jojuhu
  labels:
    app: jojuhu-app
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jojuhu-app
  template:
    metadata:
      labels:
        app: jojuhu-app
    spec:
      containers:
      - name: app
        image: localhost:5000/jojuhu-app:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: jojuhu-app
  namespace: jojuhu
  labels:
    app: jojuhu-app
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: jojuhu-app
