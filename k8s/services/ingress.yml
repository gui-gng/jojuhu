apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jojuhu-ingress
  namespace: jojuhu
  labels:
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: jojuhu.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jojuhu-backend
            port:
              number: 8080
      - path: /health
        pathType: Exact
        backend:
          service:
            name: jojuhu-backend
            port:
              number: 8080
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /jaeger
        pathType: Prefix
        backend:
          service:
            name: jaeger
            port:
              number: 16686
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jojuhu-frontend
            port:
              number: 3000