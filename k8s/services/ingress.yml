apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jojuhu-ingress
  namespace: jojuhu
  labels:
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: jojuhu.local
    http:
      paths:
      # API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jojuhu-backend
            port:
              number: 8080
      # Health check
      - path: /health
        pathType: Exact
        backend:
          service:
            name: jojuhu-backend
            port:
              number: 8080
      # Monitoring
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /jaeger
        pathType: Prefix
        backend:
          service:
            name: jaeger
            port:
              number: 16686
      # Flutter App (/app path)
      - path: /app
        pathType: Prefix
        backend:
          service:
            name: jojuhu-frontend
            port:
              number: 3000
      # Website (Astro) - default root
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jojuhu-website
            port:
              number: 3000
---
# Separate ingress for Flutter app at root (app.jojuhu.local)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jojuhu-app-ingress
  namespace: jojuhu
  labels:
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: app.jojuhu.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jojuhu-frontend
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jojuhu-backend
            port:
              number: 8080