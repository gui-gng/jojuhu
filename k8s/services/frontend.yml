apiVersion: apps/v1
kind: Deployment
metadata:
  name: jojuhu-frontend
  namespace: jojuhu
  labels:
    app: jojuhu-frontend
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jojuhu-frontend
  template:
    metadata:
      labels:
        app: jojuhu-frontend
    spec:
      containers:
      - name: frontend
        image: localhost:5000/jojuhu-frontend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        # API_URL is set at build time via --dart-define
        # Empty value means relative URLs (nginx proxies /api to backend)
        # To use absolute URL, rebuild with: --dart-define=API_URL=http://backend:8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: jojuhu-frontend
  namespace: jojuhu
  labels:
    app: jojuhu-frontend
    app.kubernetes.io/name: jojuhu
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: jojuhu-frontend