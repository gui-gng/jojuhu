[package]
name = "jojuhu-api-flow-tests"
version = "0.1.0"
edition = "2021"
description = "Comprehensive API flow tests for Jojuhu backend"

[lib]
name = "jojuhu_api_flow_tests"
path = "src/lib.rs"

[[bin]]
name = "api-flow-tests"
path = "src/main.rs"

[[bin]]
name = "generate-users"
path = "src/bin/generate_users.rs"

[dependencies]
# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID
tokio-test = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Random data generation
fake = { version = "2.9", features = ["derive"] }
rand = "0.8"

# Colored output for terminal
colored = "2.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Environment
lazy_static = "1.4"

# Async concurrency
async-trait = "0.1"

# Configuration
config = "0.14"
dotenvy = "0.15"

[dev-dependencies]
# Test assertions
pretty_assertions = "1.4"