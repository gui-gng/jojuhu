version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jojuhu_backend_app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      RUST_LOG: ${RUST_LOG:-info}
      APP_ENVIRONMENT: production
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - jojuhu_network

  # Automated Database Backups
  postgres-backup:
    image: postgres:16-alpine
    container_name: jojuhu-postgres-backup
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-jojuhu_backend_db}
      - PGUSER=${POSTGRES_USER:-jojuhu}
      - PGPASSWORD=${POSTGRES_PASSWORD:-jojuhu_secret}
      - BACKUP_RETENTION_DAYS=7
    volumes:
      - ./backups:/backups
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["/backup-entrypoint.sh"]
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - jojuhu_network

networks:
  jojuhu_network:
    external: true
