services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jojuhu_backend_app
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jojuhu_backend
      HOST: 0.0.0.0
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRATION_HOURS: 24
      RUST_LOG: info
      APP_ENVIRONMENT: production
    ports:
      - "8080:8080"

volumes:
  postgres_data_jojuhu:
